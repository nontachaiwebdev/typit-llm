<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typit LLM Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px 20px;
      background: #1a1a2e;
      color: white;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .chat-header span {
      font-size: 12px;
      font-weight: 400;
      opacity: 0.6;
      margin-left: 8px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.user {
      background: #1a1a2e;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: #f0f0f0;
      color: #1a1a1a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.loading {
      background: #f0f0f0;
      color: #888;
      align-self: flex-start;
    }

    .sources {
      align-self: flex-start;
      font-size: 12px;
      color: #888;
      margin-top: -6px;
      padding: 0 4px;
    }

    .sources span {
      display: inline-block;
      background: #e8e8e8;
      border-radius: 4px;
      padding: 2px 8px;
      margin: 2px 2px 0 0;
      font-size: 11px;
      color: #555;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      height: 44px;
      line-height: 1.4;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #1a1a2e; }

    button {
      padding: 10px 20px;
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      Typit LLM <span>RAG · typit-llm-production.up.railway.app</span>
    </div>
    <div class="messages" id="messages">
      <div class="message assistant">Hi! Ask me anything about the documents.</div>
    </div>
    <div class="input-area">
      <textarea
        id="input"
        placeholder="Type your message... (Enter to send, Shift+Enter for new line)"
      ></textarea>
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const API_URL = "https://typit-llm-production.up.railway.app/chat";
    const API_KEY = "e6021871c6b67b00229788e39c8560c29c38316dfac6862cf6ddf00222fd0e48";

    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const sendBtn = document.getElementById("sendBtn");

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      sendBtn.disabled = true;

      addMessage(text, "user");
      const loading = addMessage("Thinking...", "loading");

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": API_KEY,
          },
          body: JSON.stringify({ message: text }),
        });

        const data = await res.json();
        loading.remove();
        addMessage(data.answer ?? data.error ?? "No response", "assistant");

        if (data.sources?.length) {
          const div = document.createElement("div");
          div.className = "sources";
          div.innerHTML = "References: " + data.sources.map(s => `<span>📄 ${s}</span>`).join("");
          messages.appendChild(div);
          messages.scrollTop = messages.scrollHeight;
        }
      } catch (err) {
        loading.remove();
        addMessage("Error: Could not connect to server. Is it running?", "assistant");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
